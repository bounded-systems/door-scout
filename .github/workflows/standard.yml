name: standard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    uses: bounded-systems/.github/.github/workflows/repo-standard.yml@2cd9ebc0a2543b3ba11dc7673b351a9d1f6c9445
    with:
      security: true
      test: true
      runtime: nix
      test-command: "nix shell nixpkgs#bun -c bun test"
