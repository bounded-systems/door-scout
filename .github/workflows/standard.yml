name: standard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    uses: bounded-systems/.github/.github/workflows/repo-standard.yml@1716efd3a3cc81ba97e0ff2be0f9a0a0ebd6574c
    with:
      security: true
      test: true
      runtime: nix
      test-command: "nix shell nixpkgs#bun -c bun test"
