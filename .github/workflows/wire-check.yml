name: wire-check
# Daemon-side wire conformance: scoutd's METHODS must match the published
# scout-wire agreement. door-scout's flake checks are otherwise darwin-only and
# never run in CI — this runs the Linux-scoped conformance check on every PR.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scout-wire-methods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
      - uses: DeterminateSystems/flakehub-cache-action@e62e272c914d4ad8e4d1587a864e9c3ad2cba9de # v3.21.9
      - name: scoutd METHODS conform to scout-wire
        run: nix build --print-build-logs '.#checks.x86_64-linux.scout-wire-methods'
